    <form class="signin-container" id="loginForm" method="post" action="login.php">

        <h1 class="login-title">LOGIN</h1>

        <!-- EMAIL -->
        <section class="input-box">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="name@example.com" required autocomplete="username">
            <i class="bx bxs-user" aria-hidden="true"></i>

        </section>

        <!-- PASSWORD -->
        <section class="input-box">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
            <i class="bx bxs-lock-alt" aria-hidden="true"></i>

            <!-- SHOW / HIDE PASSWORD -->
            <button type="button" class="toggle-password" id="toggle-password" aria-label="Show password"aria-pressed="false">
                <i class="bx bx-show" id="eyeIcon" aria-hidden="true"></i>
            </button>

        </section>

        <!-- LOGIN BUTTON -->
        <button class="login-button" type="submit" id="loginButton">
            Login
        </button>

        <!-- LOGIN FEEDBACK -->
        <small id="loginMessage" class="login-message" aria-live="polite"></small>

        <h5 class="dont-have-an-account">
            Don't have an account?
            <a href="signup.html"><b>Sign Up</b></a>

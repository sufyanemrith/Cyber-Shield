        <form class="signup-container" action="signup.php" method="POST">
            <h1 class="signup-title">SIGN UP</h1> 

            <section class="input-box">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="USERNAME" required>
                <i class="bx bxs-user"></i>
            </section>
        
            <section class="input-box"> 
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="FULL NAME" required>
                <i class="bx bxs-user details"></i>
            </section>

            <section class="input-box">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="name@example.com" required>
                <i class="bx bxs-user"></i>
            </section>

            <section class="input-box">
                <label for="password">Password</label>
                <input type="password"  id="password" name="password" placeholder="Enter your password" minlength="8" required aria-describedby="passwordMessage" autocomplete="new-password">
                <i class="bx bxs-lock-alt"></i>

                <button type="button" class="toggle-password" id="toggle-password" aria-label="Show Password" aria-pressed="false">
                    <i class="bx bx-show" id="eyeIcon"></i>
                </button> 

                <small id="passwordMessage" class="password-message" aria-live="polite"></small>
            </section>

            <section class="terms-box">
                <input type="checkbox" id="terms" name="terms" required>
                
                <label for="terms">
                    I accept the <a href="terms.html" target="_blank" rel="noopener noreferrer">Terms and Conditons</a>
                </label>
                
            </section>

            <button class="signup-button" type="submit">
                Sign Up 
            </button>

            <h5 class="dont-have-an-account">
                Already have an account?
                <a href="login.html"><b>Log In</b></a>
            </h5>
        </form>

    <script src="signup.js"></script>
